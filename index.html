<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1322">
<link rel="icon" href="assets/citsa-logo.png">
<title>Information Technology: Student Check-in</title>
<style>
  :root{
    color-scheme: dark;

    --bg:#0a1322;
    --bar:#152238;
    --card:#1a2436;
    --input:#0e1929;
    --line:#2a3850;
    --line-soft:#233045;

    --text:#f2f6fc;
    --muted:#8fa0b8;
    --dim:#71839c;
    --label:#93a4bd;

    --blue:#3b9dff;
    --green:#34d399;
    --red:#f0655c;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}

  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  svg{display:block}

  .appbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bar);
    border-bottom:1px solid var(--line-soft);
  }
  .appbar-inner{
    max-width:720px;
    margin:0 auto;
    padding:13px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:46px;
    height:46px;
    flex:none;
    display:block;
  }
  .app-id{flex:1;min-width:0}
  .app-id h1{
    margin:0;
    font-size:18.5px;
    font-weight:700;
    letter-spacing:-.3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .app-id p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--muted);
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:18px 16px 44px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:18px;
  }
  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding-bottom:15px;
    margin-bottom:17px;
    border-bottom:1px solid var(--line-soft);
  }
  .card-head h2{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.3px;
  }
  .card-head p{
    margin:5px 0 0;
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
  }

  .chip{
    flex:none;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(59,157,255,.28);
    background:rgba(59,157,255,.12);
    color:#8ec5ff;
    font-size:11.5px;
    font-weight:700;
    white-space:nowrap;
  }

  .notice{
    margin:0 0 16px;
    padding:12px 14px;
    border-radius:11px;
    border:1px solid rgba(52,211,153,.4);
    background:rgba(52,211,153,.1);
    color:#a7f3d0;
    font-size:13px;
    line-height:1.5;
  }
  .notice.error{
    border-color:rgba(240,101,92,.45);
    background:rgba(240,101,92,.08);
    color:#ffb3ad;
  }

  .field{margin-bottom:15px}
  .field label{
    display:block;
    margin-bottom:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--label);
  }
  .req{color:var(--red);margin-left:1px}

  .field input{
    width:100%;
    height:50px;
    padding:0 14px;
    font:inherit;
    font-size:14.5px;
    color:var(--text);
    background:var(--input);
    border:1px solid var(--line);
    border-radius:12px;
  }
  .field input::placeholder{color:#5f7188}
  .field input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(59,157,255,.16);
  }
  .field.bad input{
    border-color:rgba(240,101,92,.85);
    background:rgba(240,101,92,.06);
  }
  .field.bad input:focus{box-shadow:0 0 0 3px rgba(240,101,92,.18)}
  .field .hint{
    display:block;
    margin-top:6px;
    font-size:11.5px;
    line-height:1.4;
    color:var(--dim);
  }
  .field .hint:empty{display:none}
  .field.bad .hint{color:#ff9a92;font-weight:600}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font:inherit;
    font-weight:700;
    border-radius:12px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn svg{width:19px;height:19px}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-primary{
    width:100%;
    height:52px;
    font-size:15px;
    color:#fff;
    background:#2f8bff;
  }
  .btn-primary:hover:not(:disabled){background:#4a9cff}

  .hint-line{
    margin:11px 0 0;
    font-size:11.5px;
    line-height:1.5;
    color:var(--dim);
    text-align:center;
  }

  .foot{
    padding:2px 6px;
    font-size:11px;
    color:#5d6f88;
    text-align:center;
  }
  .foot a{color:#7f93ad;text-decoration:none}
  .foot a:hover{color:#b9c8db;text-decoration:underline}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <img class="logo" src="assets/citsa-logo.png" alt="" width="46" height="46">
    <div class="app-id">
      <h1>Information Technology</h1>
      <p>Student Check-in</p>
    </div>
  </div>
</header>

<main>
  <section class="card" aria-labelledby="checkinTitle">
    <div class="card-head">
      <div>
        <h2 id="checkinTitle">Mark yourself present</h2>
        <p>Enter your name and student ID. You can check in once per day.</p>
      </div>
      <span class="chip" id="todayChip"></span>
    </div>

    <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

    <form id="checkForm" novalidate autocomplete="off">
      <div class="field" id="fieldName">
        <label for="studentName">Full name <span class="req">*</span></label>
        <input id="studentName" name="studentName" type="text" placeholder="Amina Yusuf"
               maxlength="60" autocapitalize="words" spellcheck="false">
        <span class="hint" id="hintName"></span>
      </div>

      <div class="field" id="fieldId">
        <label for="studentId">Student ID <span class="req">*</span></label>
        <input id="studentId" name="studentId" type="text" placeholder="PS/ITC/25/0001"
               maxlength="30" spellcheck="false">
        <span class="hint" id="hintId">Format: PS/ITC/25/0000</span>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span id="submitLabel">Submit</span>
      </button>

      <p class="hint-line">Typing only the serial number completes the ID. 12 becomes PS/ITC/25/0012.</p>
    </form>
  </section>

  <div class="foot"><a href="admin.html">Administrator panel</a></div>
</main>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = window.SUPABASE_URL || "";
  var SUPABASE_KEY = window.SUPABASE_KEY || "";

  var NAME_RE = /^[\p{L}][\p{L}\s.'-]*$/u;

  var ID_PREFIX = "PS/ITC/25/";
  var ID_DIGITS = 4;
  var ID_EXAMPLE = ID_PREFIX + "0000";
  var ID_RE = new RegExp(
    "^" + ID_PREFIX.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "\\d{" + ID_DIGITS + "}$",
    "i"
  );

  var $ = function (sel) { return document.querySelector(sel); };

  var els = {
    form: $("#checkForm"),
    name: $("#studentName"),
    id: $("#studentId"),
    hintName: $("#hintName"),
    hintId: $("#hintId"),
    fieldName: $("#fieldName"),
    fieldId: $("#fieldId"),
    submitBtn: $("#submitBtn"),
    submitLabel: $("#submitLabel"),
    notice: $("#notice"),
    todayChip: $("#todayChip")
  };

  var db = null;

  function normName(v) { return String(v || "").toLowerCase().replace(/\s+/g, " ").trim(); }

  function expandId(raw) {
    var v = String(raw || "").replace(/\s+/g, "").toUpperCase();
    if (/^\d{1,4}$/.test(v)) return ID_PREFIX + v.padStart(ID_DIGITS, "0");

    var serial = v.indexOf(ID_PREFIX) === 0 ? v.slice(ID_PREFIX.length) : "";
    if (/^\d{1,4}$/.test(serial)) return ID_PREFIX + serial.padStart(ID_DIGITS, "0");

    return v;
  }

  function idIncomplete(v) {
    var up = String(v || "").replace(/\s+/g, "").toUpperCase();
    if (/^\d{1,4}$/.test(up)) return true;
    if (up.length < ID_PREFIX.length) return ID_PREFIX.indexOf(up) === 0;
    if (up.indexOf(ID_PREFIX) !== 0) return false;

    var serial = up.slice(ID_PREFIX.length);
    return serial.length < ID_DIGITS && /^\d*$/.test(serial);
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function setFieldError(field, hint, message) {
    field.classList.add("bad");
    hint.textContent = message;
  }

  function clearFieldErrors() {
    els.fieldName.classList.remove("bad");
    els.fieldId.classList.remove("bad");
    els.hintName.textContent = "";
    els.hintId.textContent = "Format: " + ID_EXAMPLE;
  }

  function hideNotice() {
    els.notice.hidden = true;
    els.notice.textContent = "";
    els.notice.classList.remove("error");
  }

  function showNotice(message, kind) {
    els.notice.hidden = false;
    els.notice.className = "notice" + (kind === "error" ? " error" : "");
    els.notice.textContent = message;
  }

  function setBusy(on) {
    els.submitBtn.disabled = on;
    els.submitLabel.textContent = on ? "Saving..." : "Submit";
  }

  function liveHints() {
    var id = expandId(els.id.value);
    var name = els.name.value.replace(/\s+/g, " ").trim();
    var nameBad = false, idBad = false;

    clearFieldErrors();

    if (name && !NAME_RE.test(name)) {
      els.hintName.textContent = "Use letters, spaces, apostrophes, hyphens or periods.";
      els.fieldName.classList.add("bad");
      nameBad = true;
    }
    if (els.id.value.trim() && !ID_RE.test(id) && !idIncomplete(els.id.value)) {
      els.hintId.textContent = "Use the format " + ID_EXAMPLE + ".";
      els.fieldId.classList.add("bad");
      idBad = true;
    }

    if (!nameBad && !idBad && NAME_RE.test(name) && ID_RE.test(id)) {
      els.hintId.textContent = "Ready to check in.";
    }
  }

  async function submit() {
    clearFieldErrors();
    hideNotice();

    var name = els.name.value.replace(/\s+/g, " ").trim();
    var id = expandId(els.id.value);
    var bad = false;

    if (id) els.id.value = id;

    if (!name) {
      setFieldError(els.fieldName, els.hintName, "Enter your full name.");
      bad = true;
    } else if (name.length < 2) {
      setFieldError(els.fieldName, els.hintName, "Name is too short.");
      bad = true;
    } else if (!NAME_RE.test(name)) {
      setFieldError(els.fieldName, els.hintName, "Use letters, spaces, apostrophes, hyphens or periods.");
      bad = true;
    }

    if (!id) {
      setFieldError(els.fieldId, els.hintId, "Enter your student ID.");
      bad = true;
    } else if (!ID_RE.test(id)) {
      setFieldError(els.fieldId, els.hintId, "Use the format " + ID_EXAMPLE + ".");
      bad = true;
    }

    if (bad) {
      showNotice("Check the highlighted fields.", "error");
      return;
    }

    setBusy(true);

    try {
      var result = await db.rpc("check_in", { p_name: name, p_student_id: id });

      if (result.error) {
        handleError(result.error);
        return;
      }

      showNotice(result.data.name + ", you are marked present at " + fmtTime(result.data.marked_at) + ".");
      els.name.value = "";
      els.id.value = "";
      clearFieldErrors();
      els.name.focus();
    } catch (e) {
      showNotice("Could not check in. Check your connection and try again.", "error");
    } finally {
      setBusy(false);
    }
  }

  function handleError(error) {
    var message = error.message || "";
    var code = error.code || "";

    if (/ID belongs to a different student/i.test(message)) {
      setFieldError(els.fieldId, els.hintId, "That ID belongs to a different student.");
      showNotice("Check your ID and name, then try again.", "error");
      return;
    }

    if (/name is already registered/i.test(message)) {
      setFieldError(els.fieldName, els.hintName, "That name is registered with a different ID.");
      showNotice("Check the spelling of your name and ID.", "error");
      return;
    }

    if (/Already marked present/i.test(message)) {
      showNotice("You are already marked present for today.", "error");
      return;
    }

    if (/Enter your full name|name is too long/i.test(message)) {
      setFieldError(els.fieldName, els.hintName, message);
      showNotice("Check the highlighted fields.", "error");
      return;
    }

    if (/format/i.test(message)) {
      setFieldError(els.fieldId, els.hintId, "Use the format " + ID_EXAMPLE + ".");
      showNotice("Check the highlighted fields.", "error");
      return;
    }

    if (code === "PGRST202") {
      showNotice("Check-in is not available right now. Ask the administrator.", "error");
      return;
    }

    showNotice("Could not check in. Check your connection and try again.", "error");
  }

  function start() {
    els.todayChip.textContent = new Date().toLocaleDateString(undefined, {
      day: "numeric", month: "short", year: "numeric"
    });

    if (!SUPABASE_URL || !SUPABASE_KEY) {
      showNotice("Check-in is not configured. Ask the administrator.", "error");
      els.submitBtn.disabled = true;
      return;
    }
    if (typeof supabase === "undefined") {
      showNotice("The connection library could not load. Check your internet and reload.", "error");
      els.submitBtn.disabled = true;
      return;
    }

    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    submit();
  });

  els.name.addEventListener("input", function () {
    hideNotice();
    liveHints();
  });

  els.id.addEventListener("input", function () {
    hideNotice();
    liveHints();
  });

  els.id.addEventListener("blur", function () {
    var expanded = expandId(els.id.value);
    if (expanded !== els.id.value) {
      els.id.value = expanded;
      liveHints();
    }
  });

  start();
})();
</script>
</body>
</html>
